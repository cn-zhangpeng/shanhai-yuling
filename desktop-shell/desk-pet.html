<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>山海遇灵</title>
<style>
  html,body{margin:0;height:100%;background:transparent;overflow:hidden;user-select:none;
    font-family:"Microsoft YaHei","Noto Sans SC",system-ui,sans-serif}

  /* ===== 她：三层包装，动画全交给合成器 ===== */
  #petWrap{position:absolute;left:57%;bottom:6px;transform:translateX(-50%) rotate(var(--lean,0deg));cursor:grab;touch-action:none;
    transform-origin:50% 96%;transition:transform 140ms linear;will-change:transform;--dir:1}
  #petWrap.dragging{cursor:grabbing}
  /* 拖着走的时候停掉蚂蚁的漂浮/摇摆：窗口在动、它自己也在动，看着像两只被扯开了 */
  #antWrap.hold{animation:none!important}
  #antWrap.hold #antTilt{animation:none!important}
  /* 坐着时不再整只上下跳：她的"活"靠换帧（转头/眨眼/笑/说话）+ 极轻微的呼吸，
     整只位移会把脚从地面上"抬走"，看着像弹跳 */
  /* 朝向层：向左走时把整只翻转，不碰上下两层的动画 */
  #petFlip{transform:scaleX(var(--dir,1));transform-origin:50% 96%;will-change:transform}
  #petWrap.rope #petFlip{animation:ropeBounce .38s ease-in-out infinite}
  #petWrap.walking #petFlip{animation:walkBounce .8s ease-in-out infinite}
  #petStage{position:relative;animation:breathe 3.8s ease-in-out infinite;transform-origin:50% 96%;will-change:transform}
  /* 阴影不能再挂在画布上：canvas + filter 会让 Chromium 把上一帧的快照缓存下来，
     新帧画上去时旧快照还叠在下面 —— 就是"两个人影"的来源 */
  .pet-canvas{display:block;position:absolute;left:0;top:0;filter:drop-shadow(0 12px 20px rgba(60,44,34,.22))}
  .pet-canvas.under{position:relative}
  .pet-canvas.hide{opacity:0}

  /* 呼吸：纵向 0.4% 起伏 + 亚像素位移，幅度小而连续，看着是"活着"而不是"抖动" */
  @keyframes breathe{
    0%   {transform:scaleY(1)}
    50%  {transform:scaleY(1.0025)}
    100% {transform:scaleY(1)}
  }
  @keyframes sway{
    0%   {transform:translateX(-50%) rotate(-0.6deg)}
    50%  {transform:translateX(-50%) rotate(0.6deg)}
    100% {transform:translateX(-50%) rotate(-0.6deg)}
  }
  @keyframes hop{
    0%,70%,100% {margin-bottom:0}
    80%         {margin-bottom:5px}
    90%         {margin-bottom:0}
  }
  @keyframes ropeBounce{
    0%,49%,100% {transform:scaleX(var(--dir,1)) translateY(0)}
    50%         {transform:scaleX(var(--dir,1)) translateY(-9px)}
  }
  /* 走路的两拍之间只有 4 张图，靠这层连续起伏把空档填上，否则读成"摆姿势"而不是"走路"。
     周期必须等于 4 姿态 × 140ms = 560ms，错拍会看着"腿在动、人在飘" */
  @keyframes walkBounce{
    0%,100% {transform:scaleX(var(--dir,1)) translateY(0) rotate(-0.4deg)}
    45%     {transform:scaleX(var(--dir,1)) translateY(-3px) rotate(0.4deg)}
  }

  /* ===== 台词气泡 ===== */
  /* 气泡尺寸走变量：窗口缩放是整页 zoom，字号不反向补偿就会跟着一起缩小，
     50% 时字只有 7px、根本看不清。applyScale 里按 1/倍率 反算，屏幕上永远是 14px 有效字号 */
  :root{--bub-font:14px;--bub-pad-y:9px;--bub-pad-x:12px;--bub-maxw:210px;--bub-radius:11px;--bub-tail:9px}
  #bubble{position:absolute;left:50%;bottom:100%;transform:translate(-50%,4px);margin-bottom:6px;
    max-width:var(--bub-maxw);padding:var(--bub-pad-y) var(--bub-pad-x);background:#FFFDF9;border:1px solid #E3D7C7;
    border-radius:var(--bub-radius);
    box-shadow:0 8px 20px rgba(60,44,34,.18);font-size:var(--bub-font);line-height:1.55;color:#4A3B32;
    opacity:0;transition:opacity .2s;pointer-events:none;white-space:pre-wrap}
  #bubble.show{opacity:1}
  #bubble:after{content:"";position:absolute;left:50%;bottom:calc(var(--bub-tail) * -0.55);width:var(--bub-tail);height:var(--bub-tail);
    margin-left:calc(var(--bub-tail) * -0.5);
    background:#FFFDF9;border-right:1px solid #E3D7C7;border-bottom:1px solid #E3D7C7;transform:rotate(45deg)}

  /* ===== 小蚂蚁：雪碧图逐帧 + 三层叠加（上下浮 + 倾斜 + 呼吸挤压） ===== */
  #antWrap{position:absolute;left:34px;bottom:6px;cursor:pointer;transform-origin:50% 92%;will-change:transform;
    transition:opacity .25s ease}
  #antWrap.gone{opacity:0;pointer-events:none}
  #antWrap.walk{animation:antDrift 2.8s ease-in-out infinite}
  #antWrap.wiggle{animation:antWiggle .5s ease-in-out 2}
  #antTilt{animation:antTilt 5.2s ease-in-out infinite;transform-origin:50% 92%}
  #antStage{position:relative;animation:antBob 2.1s ease-in-out infinite;transform-origin:50% 92%}
  #antSprite{display:block;background-image:url(assets/ant_walk.png?v=10);background-repeat:no-repeat;
    filter:drop-shadow(0 6px 12px rgba(60,44,34,.2))}

  @keyframes antDrift{0%,100%{transform:translateX(0)}50%{transform:translateX(var(--drift, 26px))}}
  @keyframes antTilt{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
  @keyframes antBob{0%,100%{transform:translateY(0) scaleY(1)}50%{transform:translateY(2px) scaleY(.985)}}
  @keyframes antWiggle{
    0%,100%{transform:rotate(0)}
    25%{transform:rotate(-7deg)}
    75%{transform:rotate(7deg)}
  }
</style>
</head>
<body>
<div id="petWrap">
  <div id="petFlip">
    <div id="petStage">
      <canvas id="petA" class="pet-canvas under"></canvas>
      <canvas id="petB" class="pet-canvas hide"></canvas>
    </div>
  </div>
  <div id="bubble"></div>
</div>

<div id="antWrap">
  <div id="antTilt">
    <div id="antStage"><div id="antSprite"></div></div>
  </div>
</div>

<!-- 帧不再写死在这里：主进程按生灵包扫出来，通过 pet:// 协议喂进来。
     一个 <img> 一条 src 的老做法没法换生灵，见下方 loadFrames()。
     帧轨道播放器是纯逻辑，单独一层，渲染（画布/淡入/穿透上报）还是下面这套。 -->
<script src="lib/pet-state.js"></script>

<script>
/* =========================================================
   运行时数据：全部由主进程的生灵包载荷注入（开场拉一次，设置页换形象时推送）
   lines / frames / headTop / 坐姿集合 / 伴生灵 都不再是常量
   ========================================================= */
let LINES = [];
let CFG = {
  mode: 'quiet',
  modes: { quiet: { greetPerMin: 0.15 }, lively: { greetPerMin: 0.35 } },
  greeting: { enabled: true },
  display: { petHeight: 600, frameFadeMs: 0, blinkFadeMs: 0 }
};
let PROFILE = {};
let CAPS = { walk: true, rope: true, phone: true, play: true, blink: true, gestures: [] };

/* 生灵清单 v2（主进程校验后注入）：轨道 / 序列 / 相位 / 诊断。
   没有清单的老形象由主进程合成默认轨道，这里拿到的永远是校验过的数据 */
let TRACKS = {};                /* name -> { frames, durations, loop, fallback } */
let SEQUENCES = {};             /* name -> [轨道名] */
let PHASES = {};                /* blink/greet/walk/rope/phone/stand -> 轨道名 */
let DIAG = [];                  /* 诊断：坏时长、缺帧、fallback 成环… */
let PLAYER = null;              /* 帧轨道播放器（lib/pet-state.js） */
let PLAYER_APPLY = false;       /* 防回环：播放器驱动 setFrame 时不要反过来停播放器 */
let PLAYER_RAF = 0;

/* =========================================================
   素材：直接用 900×1360 原图，画布背衬=原图尺寸，
   显示尺寸交给 CSS 缩，任何 DPI 下都不糊
   ========================================================= */
let imgs = {};                 /* 帧名 -> HTMLImageElement */
let HEAD_TOP = {};             /* 帧名 -> 内容顶边比例（0~1，相对显示高度） */
let SIT_FRAMES = new Set();    /* 坐姿帧：伴生灵落地时要换空手版 */
let NOANT_MAP = {};            /* 坐姿帧 -> 空手版帧名 */
const ready = {};

function loadImage(url){
  return new Promise(res=>{
    const img = new Image();
    img.onload = ()=> res(img.naturalWidth ? img : null);
    img.onerror = ()=> res(null);
    img.src = url;
  });
}

/* 预加载整套帧：必须等全部落地再换，否则会闪出"头是新角色、身子还是旧的" */
async function loadFrames(frames){
  const out = {};
  await Promise.all(Object.entries(frames || {}).map(async ([name, f])=>{
    const img = await loadImage(f.url);
    if(img) out[name] = img;
  }));
  return out;
}

const petWrap = document.getElementById('petWrap');
const petA = document.getElementById('petA');
const petB = document.getElementById('petB');
const ctxA = petA.getContext('2d');
const ctxB = petB.getContext('2d');
const antWrap = document.getElementById('antWrap');
const antSprite = document.getElementById('antSprite');

/* 雪碧图：9 帧横向排列，按显示高度等比换算格宽，用背景位移切帧。
   参数来自生灵包里 companion 那一段；没有伴生灵时 ANT 为 null，这一整块都不跑 */
let ANT = null;
let antScale = 1, antCellPx = 340;

function initAnt(comp){
  ANT = comp || null;
  if(!ANT){
    antWrap.classList.add('gone');
    antSprite.style.backgroundImage = 'none';
    return;
  }
  antSprite.style.backgroundImage = `url("${ANT.url}")`;
  antScale = ANT.displayH / ANT.cellH;
  antCellPx = ANT.cellW * antScale;
  antSprite.style.height = ANT.displayH + 'px';
  antSprite.style.width = antCellPx + 'px';
  /* 格宽是为横躺帧留的横向空间，不向外扩，补个负 margin 让内容中心还在原位 */
  antSprite.style.marginLeft = (-(ANT.cellW - (ANT.contentW||ANT.cellW)) / 2 * antScale) + 'px';
  antSprite.style.backgroundSize = (ANT.cellW * ANT.frames * antScale) + 'px ' + ANT.displayH + 'px';
  antWrap.classList.remove('gone');
  setAntFrame(0);
}
function setAntFrame(i){
  if(!ANT) return;
  antSprite.style.backgroundPosition = (-i * antCellPx) + 'px 0';
}
const bubble = document.getElementById('bubble');

let front = 'A';          // 当前显示的是哪块画布
let curFrame = 'base';
let curImg = null;        // 当前（上一帧）图像，用于画布内过渡
let fadeRaf = 0;

/* 气泡锚点：HEAD_TOP 现在是"内容顶边占显示高度的比例"，由主进程扫 alpha 量出来。
   比例和 680 那套固定换算解耦，换任何比例的生灵都不用重新量常数 */
let bubblePinned = false;
function bubbleBottom(ratio){
  return Math.round(CFG.display.petHeight * (1 - ratio) + 4) + 'px';
}
function setBubbleAnchor(ratio){
  bubblePinned = true;
  bubble.style.bottom = bubbleBottom(ratio);
}

/* 双缓冲交叉淡入：换表情不再"啪"地跳过去 */
function paint(canvas, ctx, img){
  if(canvas.width !== img.naturalWidth || canvas.height !== img.naturalHeight){
    canvas.width = img.naturalWidth;
    canvas.height = img.naturalHeight;
    canvas.style.height = CFG.display.petHeight + 'px';
    canvas.style.width = Math.round(CFG.display.petHeight * img.naturalWidth / img.naturalHeight) + 'px';
  }
  ctx.globalAlpha = 1;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.drawImage(img, 0, 0);
}

/* 过渡必须在同一条画布里做：
   之前是两块画布各自改 CSS opacity，两张都不透明时中间态只有 75% 不透明度，
   窗口是穿透的，桌面就从她身上透出来 —— 眨眼/换表情时"闪一下"就是这么来的。
   这里先把旧帧满不透明画上去，再把新帧按 alpha 叠上去，画布整体始终不透明。 */
function paintMix(ctx, canvas, fromImg, toImg, t){
  ctx.globalAlpha = 1;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  if(fromImg) ctx.drawImage(fromImg, 0, 0);
  if(toImg && t > 0){ ctx.globalAlpha = t; ctx.drawImage(toImg, 0, 0); }
  ctx.globalAlpha = 1;
}

function setFrame(name, ms, fadeMs){
  /* 有人手动换帧（点击/拖动/场景脚本）就先收回播放器的控制权，
     否则播放器下一拍会把帧又盖回它自己的轨道 */
  if(!PLAYER_APPLY && PLAYER) PLAYER.stop();
  /* 蚂蚁在地上（near）时，坐姿帧必须换成空手帧——否则怀里那只和地上那只同时出现 */
  if(typeof ANT_STATE !== 'undefined' && ANT_STATE.mode === 'near' && SIT_FRAMES.has(name)) name = NOANT_MAP[name] || name;
  const img = imgs[name] || imgs.base;
  if(!img) return;
  if(name === curFrame && ms === undefined) return;
  curFrame = name;

  /* 气泡跟着头顶走：不同姿态她头顶高度差最多 110px，写死会飘。
     但场景演到一半时别跟着抖——那种抖动就是你看到的"卡片一闪一闪" */
  const top = HEAD_TOP[name];
  if(top != null && !SCENE.running && !bubblePinned) bubble.style.bottom = bubbleBottom(top);

  /* 只有"同一姿态、只换脸"的帧才适合淡入（眨眼/张嘴/笑）。
     换姿态（转头、晃脚、抬手、挥手）两张帧的轮廓对不上，叠在一起就是"两个她"，
     必须硬切——Sprite 桌宠全是这么干的 */
  const POSE_CUT = new Set(['turn','turnL','wave','footSwing','handEar',
                            'ntTurn','ntTurnL','ntWave','ntFootSwing','ntHandEar',
                            'base','noant','stand','walkA','walkB','walkP1','walkP2','phone','ropeAir','ropeLand']);
  const fade = fadeMs != null ? fadeMs
             : (name === 'blink' ? CFG.display.blinkFadeMs : (POSE_CUT.has(name) ? 0 : CFG.display.frameFadeMs));
  const from = curImg;

  if(cancelAnimationFrame) cancelAnimationFrame(fadeRaf);
  const sizeChanged = (petA.width !== img.naturalWidth || petA.height !== img.naturalHeight);

  if(fade <= 0 || !from || sizeChanged){
    paint(petA, ctxA, img);
    curImg = img;
  } else {
    const t0 = performance.now();
    const step = (now)=>{
      const p = Math.min(1, (now - t0) / fade);
      if(p < 1){
        paintMix(ctxA, petA, from, img, p);
        fadeRaf = requestAnimationFrame(step);
      } else {
        /* 收尾必须"只画新帧"：paintMix(t=1) 仍是先画旧帧再叠新帧，
           新帧透明的地方（比如蹲着时头顶上方那片空白）会留下旧帧的身体 —— 这就是叠影 */
        paint(petA, ctxA, img);
        curImg = img;
        fadeRaf = 0;
      }
    };
    fadeRaf = requestAnimationFrame(step);
  }

  clearTimeout(setFrame.t);
  /* 回坐姿的过渡要跟出去时一样长，否则"回去"这一下比"来"更硬，看着像抽搐 */
  if(ms) setFrame.t = setTimeout(()=>setFrame('base', undefined, fadeMs), ms);
  reportRects();
}

/* =========================================================
   帧轨道播放器（清单 v2）：tracks/sequences/phases 由主进程校验后注入。
   播放器只决定"该显示哪一帧"，绘制仍走 setFrame（双缓冲/淡入/穿透上报都在那），
   所以没有清单的老形象和写死帧的旧代码走的是同一条渲染路径。
   ========================================================= */
function stopPlayer(){
  if(PLAYER) PLAYER.stop();
  if(PLAYER_RAF){ cancelAnimationFrame(PLAYER_RAF); PLAYER_RAF = 0; }
}

function ensurePlayer(){
  if(PLAYER || !window.PetState) return PLAYER;
  PLAYER = window.PetState.createPlayer({
    tracks: TRACKS,
    sequences: SEQUENCES,
    onFrame: (frame)=>{
      /* 防回环：播放器驱动 setFrame 时，setFrame 不能再反过来停播放器。
         传 ms=0 表示"别自动回坐姿"，淡入淡出仍按帧名自动选（眨眼半透明过渡、换姿态硬切） */
      PLAYER_APPLY = true;
      try { setFrame(frame, 0); } finally { PLAYER_APPLY = false; }
    }
  });
  return PLAYER;
}

/* 播放器自己按帧时长排程，这里每帧问一次"现在该显示哪帧"；没有变化的帧不会重画 */
function kickPlayer(){
  if(PLAYER_RAF) return;
  const step = (ts)=>{
    PLAYER_RAF = 0;
    if(!PLAYER) return;
    if(SCENE.running){ PLAYER.stop(); return; }   /* 场景脚本接管时把控制权让出去 */
    PLAYER.tick(ts);
    if(PLAYER.isActive()) kickPlayer();
  };
  PLAYER_RAF = requestAnimationFrame(step);
}

/* 有轨道就按清单里的节奏播（时长/循环/回落都来自清单），没有就返回 false 让调用方退回显式时长 */
function playTrack(name){
  const p = ensurePlayer();
  if(!p || !TRACKS[name]) return false;
  p.play(name);
  kickPlayer();
  return true;
}

function playSequence(name){
  const p = ensurePlayer();
  if(!p || !SEQUENCES[name] || !SEQUENCES[name].length) return false;
  p.playSequence(name);
  kickPlayer();
  return true;
}

/* =========================================================
   台词引擎
   ========================================================= */
const S = { dragging:false, moved:false, lastSpoke:{}, spoke:0, nextSwitchAt:0, mode:'REST' };

function rand(a,b){ return a + Math.random()*(b-a); }

function eligible(cat){
  const now = performance.now();
  return LINES.filter(l=>{
    if(cat && l.c !== cat) return false;
    if(!l.tags.includes(CFG.mode)) return false;
    return (now - (S.lastSpoke[l.i] || -Infinity)) >= l.cd*1000*0.12;
  });
}
function pick(cat){
  const pool = eligible(cat).length ? eligible(cat)
             : LINES.filter(l=>l.tags.includes(CFG.mode) && (!cat || l.c===cat));
  if(!pool.length) return null;
  let total = pool.reduce((s,l)=>s+l.w,0), r = Math.random()*total;
  for(const l of pool){ if(r < l.w) return l; r -= l.w; }
  return pool[pool.length-1];
}
function showBubble(text){
  bubble.textContent = text;
  bubble.classList.add('show');
  clearTimeout(showBubble.t);
  showBubble.t = setTimeout(()=>bubble.classList.remove('show'), Math.max(2600, text.length*200));
}
function say(cat){
  const l = pick(cat);
  if(!l) return;
  S.lastSpoke[l.i] = performance.now();
  S.spoke++;
  showBubble(l.t);
  if(l.fu){ clearTimeout(say.ft); say.ft = setTimeout(()=>{ if(!S.dragging) showBubble(l.fu.t); }, l.fu.d*1000); }
}

/* =========================================================
   穿透区上报（外扩 12px），只在变化时发，不占 IPC
   ========================================================= */
let lastRects = '';
function reportRects(){
  if(!window.petAPI) return;
  const pad = 12, rects = [];
  const antInset = (ANT && ANT.contentW) ? (ANT.cellW - ANT.contentW) / 2 * antScale : 0;
  for(const el of [petA, antSprite]){
    let r = el.getBoundingClientRect();
    if(r.width < 2) continue;
    if(el === antSprite && antInset > 0) r = { x: r.x + antInset, y: r.y, width: r.width - antInset*2, height: r.height };
    rects.push({ x:Math.round(r.x-pad), y:Math.round(r.y-pad), w:Math.round(r.width+pad*2), h:Math.round(r.height+pad*2) });
  }
  const key = JSON.stringify(rects);
  if(key !== lastRects){ lastRects = key; window.petAPI.reportRects(rects); }
}
setInterval(reportRects, 800);

/* =========================================================
   眨眼：单纯的时间调度，绘制只发生在帧变化那一刻
   ========================================================= */
function scheduleBlink(){
  setTimeout(()=>{
    /* 没有伴生灵时 ANT_STATE.mode 是 none，眨眼不能被这个条件挡掉 */
    if(!S.dragging && !SCENE.running && curFrame === 'base' && ANT_STATE.mode !== 'near' && imgs.blink){
      if(!playTrack(PHASES.blink || 'blink')) setFrame('blink', 150);
    }
    scheduleBlink();
  }, rand(2600, 6200));
}

/* =========================================================
   交互
   ========================================================= */
let dragAnchor = null;

petWrap.addEventListener('pointerdown', e=>{
  if(e.button !== 0) return;
  S.dragging = true; S.moved = false;
  dragAnchor = { x:e.screenX, y:e.screenY };
  petWrap.classList.add('dragging');
  antWrap.classList.add('hold');
  if(window.petAPI) window.petAPI.dragStart(e.screenX, e.screenY);
  petWrap.setPointerCapture(e.pointerId);
});

petWrap.addEventListener('pointermove', e=>{
  if(!S.dragging) return;
  if(Math.abs(e.screenX-dragAnchor.x) > 4 || Math.abs(e.screenY-dragAnchor.y) > 4) S.moved = true;
  if(S.moved && window.petAPI){ window.petAPI.dragMove(e.screenX, e.screenY); reportRects(); }
});

petWrap.addEventListener('pointerup', ()=>{
  if(!S.dragging) return;
  S.dragging = false;
  petWrap.classList.remove('dragging');
  antWrap.classList.remove('hold');

});

petWrap.addEventListener('pointerenter', ()=>{

/* =========================================================
   小蚂蚁：held / near 两态互斥——她抱着时不画地上的蚂蚁，
   放下之后地上才出现。帧位：0 待机 1 迈左 2 迈右 3 快走 4 蹲坐 5 仰头
   ========================================================= */
const ANT_STATE = { mode:'held', busy:false };

function setAntMode(mode, opts){
  const o = opts || {};
  ANT_STATE.mode = mode;
  ANT_STATE.busy = false;
  if(!ANT){                                     /* 这只生灵没有伴生灵：地面那只永远不出现 */
    ANT_STATE.mode = 'none';
    antWrap.classList.add('gone');
    return;
  }
  antWrap.classList.toggle('gone', mode === 'held');
  antWrap.classList.remove('walk');
  setAntFrame(0);
  /* 视觉同步：抱着→她用抱蚁的帧；放下→她换空手帧，地面上才出现那只 */
  if(imgs.noant) setFrame(mode === 'held' ? 'base' : 'noant', 600);
  if(o.sayLine) setTimeout(()=>say('ant'), 200);
}

function antWalkCycle(times, speed){
  if(ANT_STATE.busy || ANT_STATE.mode !== 'near') return;
  ANT_STATE.busy = true;
  /* 漂移方向跟着她走的方向：往右走进位为正、往左走为负，脚和位移同向才不会"蹬反" */
  antWrap.style.setProperty('--drift', (SCENE.dir > 0 ? 26 : -26) + 'px');
  antWrap.classList.add('walk');
  // 走路循环只在 1↔2 之间交替，3 是快走帧，脚步节奏 110ms
  const cycle = [1, 2];
  let i = 0, rounds = 0;
  const timer = setInterval(()=>{
    setAntFrame(cycle[i % 2]);
    i++;
    if(i % 2 === 0){
      rounds++;
      if(rounds >= (times || 3)){
        clearInterval(timer);
        antWrap.classList.remove('walk');
        setAntFrame(0);
        ANT_STATE.busy = false;
      }
    }
  }, speed || 110);
}

function antRun(){
  if(ANT_STATE.busy || ANT_STATE.mode !== 'near') return;
  ANT_STATE.busy = true;
  antWrap.classList.add('walk');
  antWrap.style.setProperty('--drift', (SCENE.dir > 0 ? 46 : -46) + 'px');
  let i = 0, rounds = 0;
  const timer = setInterval(()=>{
    setAntFrame(i % 2 === 0 ? 3 : 1);
    i++;
    if(i % 2 === 0){
      rounds++;
      if(rounds >= 3){
        clearInterval(timer);
        antWrap.classList.remove('walk');
        antWrap.style.setProperty('--drift', (SCENE.dir > 0 ? 26 : -26) + 'px');
        setAntFrame(0);
        ANT_STATE.busy = false;
      }
    }
  }, 90);
}

function antSit(ms){
  if(ANT_STATE.busy || ANT_STATE.mode !== 'near') return;
  ANT_STATE.busy = true;
  setAntFrame(4);
  setTimeout(()=>{ setAntFrame(0); ANT_STATE.busy = false; }, ms || 6000);
}

function antLookUp(ms){
  if(ANT_STATE.busy || ANT_STATE.mode !== 'near') return;
  ANT_STATE.busy = true;
  setAntFrame(5);
  setTimeout(()=>{ setAntFrame(0); ANT_STATE.busy = false; }, ms || 1600);
}

/* 蹦一下：腾空帧 + 整只往上跳 */
function antHop(){
  if(ANT_STATE.busy || ANT_STATE.mode !== 'near') return;
  ANT_STATE.busy = true;
  setAntFrame(6);
  antWrap.classList.add('wiggle');
  setTimeout(()=>{
    antWrap.classList.remove('wiggle');
    setAntFrame(0);
    ANT_STATE.busy = false;
  }, 620);
}

/* 侧面跑：侧身帧 + 横向滑动，看着像真的撒腿跑 */
function antSideRun(ms){
  if(ANT_STATE.busy || ANT_STATE.mode !== 'near') return;
  ANT_STATE.busy = true;
  antWrap.classList.add('walk');
  antWrap.style.setProperty('--drift', '64px');
  setAntFrame(7);
  setTimeout(()=>{
    antWrap.classList.remove('walk');
    antWrap.style.setProperty('--drift', '26px');
    setAntFrame(0);
    ANT_STATE.busy = false;
  }, ms || 1400);
}

/* 四脚朝天打滚卖乖 */
function antFlop(ms){
  if(ANT_STATE.busy || ANT_STATE.mode !== 'near') return;
  ANT_STATE.busy = true;
  setAntFrame(8);
  setTimeout(()=>{ setAntFrame(0); ANT_STATE.busy = false; }, ms || 1800);
}

function antBehavior(){
  if(!ANT){ setTimeout(antBehavior, 6000); return; }   /* 没有伴生灵也把链子留着：换形象后能自己接上 */
  if(SCENE.running){ setTimeout(antBehavior, 5000); return; }
  if(ANT_STATE.mode === 'near'){
    const acts = ['walk','walk','run','sit','look','wiggle','hop','sideRun','flop','none'];
    const act = acts[Math.floor(Math.random()*acts.length)];
    if(act === 'walk') antWalkCycle(2 + Math.floor(Math.random()*2));
    if(act === 'run') antRun();
    if(act === 'sit') antSit(5000 + Math.random()*5000);
    if(act === 'look') antLookUp(1400);
    if(act === 'hop') antHop();
    if(act === 'sideRun') antSideRun(1200 + Math.random() * 900);
    if(act === 'flop') antFlop(1600 + Math.random() * 1200);
    if(act === 'wiggle'){
      antWrap.classList.add('wiggle');
      setTimeout(()=>antWrap.classList.remove('wiggle'), 1100);
      setTimeout(()=>say('ant'), 400);
    }
  }
  setTimeout(antBehavior, rand(5000, 11000));
}

/* 她抱起 / 放下的节奏：抱 40~70 秒，放下陪 50~100 秒 */
function antCycle(){
  if(!ANT){ setTimeout(antCycle, 30000); return; }
  if(SCENE.running){ setTimeout(antCycle, 30000); return; }
  if(ANT_STATE.mode === 'held'){
    setAntMode('near', { sayLine:true });
    setTimeout(antCycle, rand(50, 100)*1000);
  } else {
    setAntMode('held', { sayLine:false });
    setTimeout(antCycle, rand(40, 70)*1000);
  }
}

antWrap.addEventListener('click', ()=>{
  antWrap.classList.add('wiggle');
  setTimeout(()=>antWrap.classList.remove('wiggle'), 1100);
  antLookUp(1200);
  setTimeout(()=>say('ant'), 300);
});

/* =========================================================
   场景脚本：从"坐着不动的表情包"变成"会起身、会走、会跳绳、会躲角落"
   一个场景 = 姿态序列 + 窗口平移 + 蚂蚁状态 + 台词，四件事绑在一起演
   ========================================================= */
const SCENE = { running:false, dir:1, pending:null };

/* 菜单/快捷键随时可能点，先把监听挂上；boot 没跑完就排队，跑完自动放行 */
let BOOTED = false;
const sceneQueue = [];
if(window.petAPI && window.petAPI.onScene){
  window.petAPI.onScene(name => {
    console.log('[scene] recv:', name, 'booted=', BOOTED);
    if(BOOTED) runScene(name); else sceneQueue.push(name);
  });
}

const sleep = ms => new Promise(r => setTimeout(r, ms));

/* 钉住：窗口位置锁死，走动类场景直接不演（原地踏步看着像原地搓地，不如不做） */
let PINNED = false;
if(window.petAPI && window.petAPI.onPin){
  window.petAPI.onPin(v => { PINNED = !!v; console.log('[pin]', PINNED); });
}

/* 锁定：鼠标整个穿透（主进程 setIgnoreMouseEvents 常开），渲染层这边只需要给一句反馈。
   锁定期间右键/拖拽本来就收不到事件，不用再挡一层 */
if(window.petAPI && window.petAPI.onLock){
  window.petAPI.onLock(v => {
    console.log('[lock]', v);
    if(v) setTimeout(()=>say('locked'), 400);
  });
}

/* 缩放：整只 body 等比缩放，窗口由主进程同步缩到对应尺寸。
   必须先把 body 定成基准尺寸，否则它按缩小后的视口自适应、再被 scale 缩第二次 */
const BASE_W = 620, BASE_H = 760;
/* 缩放：用 zoom 而不是 transform。
   transform + bottom 原点会以 body 的固定高度为基准，窗口比 body 矮时整只被裁到屏幕外，
   zoom 直接按布局单位缩放，内容自然铺满缩小后的视口 */
let currentScale = 1;
function applyScale(s){
  currentScale = s;
  document.documentElement.style.zoom = s;
  /* 文字反向补偿：屏幕上的有效字号固定，50% 时也不会缩成看不清的一行小字 */
  const r = document.documentElement.style;
  r.setProperty('--bub-font', Math.round(14 / s) + 'px');
  r.setProperty('--bub-pad-y', Math.round(9 / s) + 'px');
  r.setProperty('--bub-pad-x', Math.round(12 / s) + 'px');
  r.setProperty('--bub-maxw', Math.round(210 / s) + 'px');
  r.setProperty('--bub-radius', Math.round(11 / s) + 'px');
  r.setProperty('--bub-tail', Math.round(9 / s) + 'px');
  setTimeout(()=>{
    const b = petWrap.getBoundingClientRect();
    const bb = bubble.getBoundingClientRect();
    console.log('[scale] s=', s, 'viewport=', innerWidth + 'x' + innerHeight,
      'pet=', Math.round(b.left) + ',' + Math.round(b.top) + ',' + Math.round(b.width) + 'x' + Math.round(b.height),
      'bubble=', Math.round(bb.width) + 'x' + Math.round(bb.height));
    reportRects();
  }, 80);
}
if(window.petAPI && window.petAPI.onScale){
  window.petAPI.onScale(s => applyScale(s));
}

/* 蚂蚁是朝左画的（和她的步态同向），而它的漂浮动画默认往右挪，
   所以"往右"必须镜像、往左保持原样，否则就是倒着走 */
function faceAnt(d){
  antSprite.style.transform = d > 0 ? 'scaleX(-1)' : 'scaleX(1)';
}

function setDir(d){
  SCENE.dir = d;
  /* 素材里的步态是朝画面左边迈的（walkA/walkB 前脚脚尖都朝左），
     所以往右走时要镜像、往左走时不镜像，否则就是倒着走 */
  petWrap.style.setProperty('--dir', -d);
  faceAnt(d);
}

/* 窗口平移交给主进程做 easeInOutQuad，渲染层只管帧序，不做逐帧硬设位置 */
function glide(dx, ms){ if(window.petAPI) window.petAPI.glide(dx, ms); }

/* 走路循环用 4 个姿态（接触左 / 过渡 / 接触右 / 过渡），这是 Shimeji 同款的结构：
   它也只有 4 张走路草图，靠"每姿态连停数帧 + 位移连续"读出顺滑，不是靠帧数堆 */
const WALK_CYCLE = ['walkA', 'walkP1', 'walkB', 'walkP2'];

/* 清单里有 walk 轨道就按轨道走（帧序与每帧时长都来自清单），否则退回内置 4 帧、200ms */
function walkFramesFor(){
  const tr = TRACKS.walk;
  const frames = (tr && Array.isArray(tr.frames)) ? tr.frames.filter(n => imgs[n]) : [];
  return frames.length >= 2 ? frames : WALK_CYCLE;
}

function walkStepMs(fallback){
  const tr = TRACKS.walk;
  if(tr && Array.isArray(tr.durations) && tr.durations.length){
    const sum = tr.durations.reduce((s, n) => s + n, 0);
    return sum / tr.durations.length;
  }
  return fallback;
}

async function walkFrames(poses, poseMs){
  petWrap.classList.add('walking');
  const frames = walkFramesFor();
  const durs = (TRACKS.walk && Array.isArray(TRACKS.walk.durations)) ? TRACKS.walk.durations : null;
  for(let i=0;i<poses;i++){
    /* 每一步换一次重心：接触帧往迈出的那条腿压一点点，过渡帧回正。
       整只转 1.2° 在 600px 的身高上只有几像素，但"左—右—左—右"的重心感靠这个读出来 */
    petFlip.style.setProperty('--lean', (i % 2 ? (i % 4 === 1 ? -1.2 : 0) : (i % 4 === 0 ? 1.2 : 0)) + 'deg');
    setFrame(frames[i % frames.length], undefined, 0);
    await sleep((durs && durs[i % durs.length]) || poseMs);
  }
  petFlip.style.setProperty('--lean', '0deg');
  petWrap.classList.remove('walking');
}

async function standUp(){
  if(imgs.stand) setFrame('stand', undefined, 0);
  await sleep(430);
}

async function sitDown(){
  setFrame(ANT_STATE.mode === 'near' ? 'noant' : 'base', undefined, 0);
  await sleep(500);
}

/* 走一小段：方向随机，6~11 个半步，蚂蚁在脚边一起走 */
async function sceneWalk(){
  setAntMode('near');
  await standUp();
  const dir = /dirR/i.test(location.hash) ? 1
            : (/dirL/i.test(location.hash) ? -1 : (Math.random() < 0.5 ? 1 : -1));
  setDir(dir);
  const poses = 12 + Math.floor(Math.random() * 10);
  const poseMs = walkStepMs(200);                  /* 每姿态时长跟随清单的 walk 轨道；没有轨道就是 200ms */
  glide(dir * poses * 18, poses * poseMs);          // 每姿态推 18px：步子小一点，整体滑行速度降下来
  antWalkCycle(Math.max(2, Math.round(poses / 4)), poseMs * 2);
  await walkFrames(poses, poseMs);
  if(imgs.stand) setFrame('stand', undefined, 0);
  await sleep(480);
  if(Math.random() < 0.5) say('greeting');
  await sitDown();
}

/* 跳绳：绳在头顶成弧↔绳绕到脚下，配合整只的上下弹跳 */
async function sceneRope(){
  setAntMode('near');
  await standUp();
  petWrap.classList.add('rope');
  const rounds = 7 + Math.floor(Math.random() * 5);
  /* 绳在头顶成弧↔绳绕到脚下：帧和节奏都跟清单走，没有清单就是内置的两帧 185ms */
  const tr = TRACKS.rope;
  const ropeFrames = (tr && Array.isArray(tr.frames) && tr.frames.length >= 2 && tr.frames.every(n => imgs[n]))
    ? tr.frames : ['ropeAir', 'ropeLand'];
  const ropeDurs = (tr && Array.isArray(tr.durations) && tr.durations.length >= 2) ? tr.durations : [185, 185];
  for(let i=0;i<rounds;i++){
    setFrame(ropeFrames[0], undefined, 0);
    await sleep(ropeDurs[0] || 185);
    setFrame(ropeFrames[1], undefined, 0);
    await sleep(ropeDurs[1] || ropeDurs[0] || 185);
  }
  petWrap.classList.remove('rope');
  if(imgs.stand) setFrame('stand', undefined, 0);
  await sleep(420);
  if(Math.random() < 0.35) showBubble('我跳了 ' + rounds + ' 个！');
  await sitDown();
}

/* 躲角落玩手机：一路走到屏幕边（主进程按工作区夹住），蹲下偷玩一会儿 */
async function scenePhone(){
  setAntMode('near');
  await standUp();
  const dir = Math.random() < 0.5 ? 1 : -1;
  setDir(dir);
  glide(dir * 1600, 2900);                        // 一路走到屏幕边（主进程按工作区夹住）
  await walkFrames(12, 190);
  setFrame('phone', undefined, 0);
  showBubble(['我就玩一小会儿……', '别过来，我在写作业。', '这个游戏怎么老输。'][Math.floor(Math.random()*3)]);
  await sleep(13000 + Math.random() * 7000);
  if(imgs.stand) setFrame('stand', undefined, 0);
  await sleep(450);
  setDir(-dir);
  glide(-dir * (320 + Math.random() * 380), 1800);
  await walkFrames(6, 190);
  await sitDown();
}

/* 陪小蚂蚁玩：坐下，蚂蚁在脚边跑一圈、仰头看她 */
/* 陪小蚂蚁玩：约 12 秒有来有回的小戏——她转头找它、它跑过来、蹦一下、翻个肚，她笑、挥手 */
async function scenePlayAnt(){

  antSideRun(1300);                          /* 蚂蚁撒腿跑过来 */
  await sleep(1500);

  setFrame('ntSmile', 1300);                 /* 看到它，笑 */
  showBubble('跳一个给我看看。');

/* 场景名 → 需要的能力。缺帧时给一句解释就收，而不是演到一半卡住 */
const SCENE_CAP = { walk:'walk', rope:'rope', phone:'phone', play:'play' };

/* 场景期间的固定气泡锚点：按这套帧自己量出来的头顶比例算，不写死数值 */
function sceneAnchor(name){
  const pick = (list)=>{
    const vs = list.map(n=>HEAD_TOP[n]).filter(v=>typeof v === 'number');
    return vs.length ? vs.reduce((a,b)=>a+b,0)/vs.length : null;
  };
  if(name === 'walk') return pick(['stand','walkA','walkB','walkP1','walkP2']) ?? HEAD_TOP.base ?? 0.2;
  if(name === 'rope'){                                   /* 跳绳取最高的那帧，气泡不压到绳子上 */
    const vs = ['ropeAir','ropeLand'].map(n=>HEAD_TOP[n]).filter(v=>typeof v === 'number');
    return vs.length ? Math.min(...vs) : HEAD_TOP.base ?? 0.2;
  }
  if(name === 'phone') return HEAD_TOP.phone ?? HEAD_TOP.base ?? 0.2;
  return HEAD_TOP.base ?? HEAD_TOP.noant ?? 0.2;
}

async function runScene(name){
  if(!name) return;
  /* 缺帧：直接说清楚，别演到一半卡住，也别让菜单点了像没反应 */
  const capKey = SCENE_CAP[name];
  if(capKey && !CAPS[capKey]){
    showBubble(name === 'play' ? '这套图里没有伴生灵，我陪你坐着就好～' : '这套形象还缺动作帧，这个动作演不了。');
    return;
  }
  /* 钉住时不做位移场景：走两步、躲角落都要挪窗口，钉住就等于骗人 */
  if(PINNED && (name === 'walk' || name === 'phone')){
    showBubble(name === 'walk' ? '不是钉在这儿了吗？我就在这儿陪你～' : '钉住啦，不去角落了。');
    return;
  }
  /* 正在演一场就排队，不要吞掉——原来直接 return，菜单点了像没反应 */
  if(SCENE.running){
    SCENE.pending = name;
    console.log('[scene] busy, queue:', name);
    return;
  }
  if(S.dragging) return;
  if(!imgs.base){ console.warn('[scene] 一张帧都没有，跳过:', name); return; }
  stopPlayer();                                   /* 场景脚本接管帧序，先把播放器停掉 */
  SCENE.running = true;
  const watchdog = setTimeout(()=>{                 /* 卡住兜底：30s 后强制解锁 */
    if(SCENE.running){ console.warn('[scene] watchdog unlock'); SCENE.running = false; }
  }, 30000);
  petWrap.classList.remove('hop');
  /* 场景里帧的头顶高度一直在变（跳绳两帧、走路与蹲姿），
     每换一帧就重设气泡位置会让卡片上下抽动。场景开始时定一次锚点，演完再交回逐帧跟随 */
  setBubbleAnchor(sceneAnchor(name));
  /* 点了立刻给一句反馈，否则"站起来/走到边上"这段空档里看着像没反应 */
  const ACK = { walk:'我去走两步～', rope:'我去跳绳啦！', phone:'我去角落玩会儿手机。', play:'小蚂蚁，过来过来～' };
  if(ACK[name]) showBubble(ACK[name]);
  else say('idle');
  try{
    if(name === 'walk') await sceneWalk();
    else if(name === 'rope') await sceneRope();
    else if(name === 'phone') await scenePhone();
    else if(name === 'play') await scenePlayAnt();
  }catch(err){ console.warn('scene error', err); }
  clearTimeout(watchdog);
  SCENE.running = false;
  bubblePinned = false;                             /* 交回逐帧跟随 */
  setDir(1);
  if(SCENE.pending){                                /* 排队的那一场接着演 */
    const next = SCENE.pending;
    SCENE.pending = null;
    setTimeout(()=>runScene(next), 400);
  }
}

/* 她自己安排日程：平均 2~3.5 分钟做一件事。没有对应帧的场景不进池子 */
function scheduleScene(){
  setTimeout(async ()=>{
    const pool = (PINNED ? ['rope', 'rope', 'play', 'play'] : ['walk', 'walk', 'rope', 'phone', 'play'])
      .filter(n => CAPS[SCENE_CAP[n]]);
    if(pool.length && !SCENE.running && !S.dragging){
      await runScene(pool[Math.floor(Math.random() * pool.length)]);
    }
    scheduleScene();
  }, rand(100000, 210000));
}


/* 坐着时的"小动作"：整只不动，靠换帧演转头、笑、说话、晃脚
   怀里那只蚂蚁是画在帧里的（不是独立图层），换姿态会连它一起换，
   所以过渡要放慢到 240ms，否则看着像蚂蚁自己抽搐了一下 */
function scheduleGesture(){
  setTimeout(()=>{
    if(!SCENE.running && !S.dragging && !document.hidden){
      /* 抱着蚂蚁时优先用头部动作（蚂蚁几乎不动）；放下蚂蚁后才多用晃脚、抬手的动作。
         没有的帧直接不进池子——静态形象就是坐着，不该随机到不存在的动作 */
      const held = (ANT_STATE.mode === 'held');
      const pool = (held
        ? ['turn','turnL','turn','smile','talk','turnL','turn','handEar']
        : ['turn','turnL','smile','talk','footSwing','handEar','handEar','footSwing'])
        .filter(k => imgs[k]);
      if(pool.length){
        /* 清单给了待机序列就偶尔整段演（转头→回坐姿→笑），比单个动作更有"有戏"的感觉；
           没给序列的老形象还是随机一个动作 */
        if(SEQUENCES.idle && Math.random() < 0.4 && playSequence('idle')){
          /* 交给播放器 */
        } else {
          const k = pool[Math.floor(Math.random()*pool.length)];
          if(!playTrack(k)){
            const dur = (k === 'smile') ? 1500 : (k === 'footSwing' || k === 'handEar') ? 1200 : 900;
            setFrame(k, dur, 0);
          }
        }
      }
    }
    scheduleGesture();
  }, rand(4500, 9000));
}

function scheduleSwitch(){ S.nextSwitchAt = performance.now() + rand(25, 55)*1000; }

setInterval(()=>{
  if(S.dragging || SCENE.running) return;
  if(performance.now() > S.nextSwitchAt){
    const pool = ['REST','STUDY','PLAY'];
    const next = pool[Math.floor(Math.random()*pool.length)];
    if(next !== S.mode){
      S.mode = next;
      if(Math.random() < 0.45) say('idle');
    }
    scheduleSwitch();
  }
}, 1000);

/* 自主问候：打招呼时有一半概率抬手挥一挥（场景→动作→台词联动） */
setInterval(()=>{
  if(!CFG.greeting.enabled || S.dragging || SCENE.running) return;
  const p = CFG.modes[CFG.mode].greetPerMin / 60;
  if(Math.random() < p){
    const wave = Math.random() < 0.5;
    if(wave){
      if(!playTrack(PHASES.greet || 'wave')) setFrame('wave', 1100);
      setTimeout(()=>say('greeting'), 300);
    } else {
      if(!playTrack('talk')) setFrame('talk', 600);
      say(Math.random() < 0.5 ? 'request' : 'greeting');
    }
  }
}, 1000);

/* =========================================================
   生灵载荷 → 运行时
   主进程扫目录挑出来的那一份（frames 带 pet:// URL 和气泡锚点比例），
   这里只负责把它装进内存并让所有调度器继续跑。换形象时同一套流程再来一次。
   ========================================================= */
function computeCaps(){
  return {
    walk: !!(imgs.stand && imgs.walkA && imgs.walkB && imgs.walkP1 && imgs.walkP2),
    rope: !!(imgs.ropeAir && imgs.ropeLand),
    phone: !!imgs.phone,
    play: !!(ANT && imgs.base),
    blink: !!imgs.blink,
    gestures: ['turn','turnL','smile','talk','footSwing','handEar'].filter(n=>imgs[n])
  };
}

async function applyCreaturePayload(p){
  if(!p || !p.frames) return false;

  /* 演出中途换形象先刹车：别让旧场景的 await 继续拿新帧往下走 */
  SCENE.running = false;
  SCENE.pending = null;
  bubblePinned = false;
  bubble.classList.remove('show');
  S.dragging = false;

  const nextImgs = await loadFrames(p.frames);
  if(!Object.keys(nextImgs).length) return false;      /* 一张都没加载出来：保留旧的，别变白板 */

  /* 到这里才一次性替换：所有帧都就位，不会出现"头是新角色、身子还是旧的" */
  imgs = nextImgs;
  HEAD_TOP = {};
  SIT_FRAMES = new Set();
  for(const [name, f] of Object.entries(p.frames)){
    HEAD_TOP[name] = f.ratio;
    if(f.sit) SIT_FRAMES.add(name);
  }
  NOANT_MAP = p.noAntMap || {};

  /* 清单 v2：轨道/序列/相位/诊断随载荷一起换。换形象后旧播放器还抓着旧轨道，整个重建 */
  TRACKS = p.tracks || {};
  SEQUENCES = p.sequences || {};
  PHASES = p.phases || {};
  DIAG = Array.isArray(p.diagnostics) ? p.diagnostics : [];
  stopPlayer();
  PLAYER = null;
  if(DIAG.length) console.warn('[creature] 清单诊断', DIAG);

  CFG.display.petHeight = p.window.petHeight;
  if(p.behavior && p.behavior.modes){
    CFG.mode = p.behavior.mode === 'lively' ? 'lively' : 'quiet';
    CFG.modes = {};
    for(const [k, v] of Object.entries(p.behavior.modes)){
      CFG.modes[k] = { greetPerMin: (v && typeof v.greetPerMin === 'number') ? v.greetPerMin : 0.15 };
    }
  }
  LINES = Array.isArray(p.lines) ? p.lines : [];
  PROFILE = p.profile || {};
  S.lastSpoke = {};

  initAnt(p.companion);
  setAntMode(p.companion ? 'held' : 'none');    /* 有蚂蚁时开场抱着它，地上不出现第二只 */

  curFrame = 'base';
  if(imgs.base){
    paint(petA, ctxA, imgs.base);
    curImg = imgs.base;                           /* 第一帧记下来，后面的过渡从它出发 */
    petA.classList.remove('hide');
    petB.classList.add('hide');
  }
  CAPS = computeCaps();
  if(window.petAPI && window.petAPI.reportCapabilities) window.petAPI.reportCapabilities(CAPS);
  applyScale(currentScale);                       /* 显示高度变了，气泡字号/穿透区都要重算 */
  reportRects();
  console.log('[creature]', p.id, p.status, 'frames=', Object.keys(imgs).length, 'caps=', JSON.stringify(CAPS));
  return true;
}

/* =========================================================
   启动
   ========================================================= */
async function boot(){
  let payload = null;
  try { payload = await window.petAPI.getCreature(); } catch(e){ console.warn('getCreature fail', e); }
  if(!payload){
    showBubble('没连上主进程：请用 npx electron . 启动（浏览器单独打开只能看静态）');
    return;
  }
  await applyCreaturePayload(payload);

  /* 调试开关（不影响正常启动）：
     #near 蚂蚁一开始就在地上；#wave / #turnl 定格对应帧；
     #s=walk / #s=rope / #s=phone / #s=play 开机即演一次对应场景 */
  const dbg = location.hash.replace('#','');
  if(dbg === 'near') setAntMode('near');
  if(dbg.startsWith('s=')) setTimeout(()=>runScene(dbg.slice(2).split(',')[0]), 2500);
  if(dbg.startsWith('g=')) setTimeout(()=>setFrame(dbg.slice(2), 999999), 2600);   /* 定格某个坐姿小动作 */

  scheduleBlink();
  scheduleSwitch();
  scheduleGesture();
  scheduleScene();
  setTimeout(antBehavior, 4000);
  setTimeout(antCycle, rand(45, 70)*1000);
  if(dbg === 'wave') setTimeout(()=>setFrame('wave', 999999), 3200);
  if(dbg === 'turnl') setTimeout(()=>setFrame('turnL', 999999), 3200);
  /* 开场自己开口：取台词库里的一句，不再写死"爸爸，陪我玩会。" */
  setTimeout(()=>{ if(imgs.talk) setFrame('talk', 600); say('request'); }, 1600);

  /* 托盘 / 右键菜单可以手动让她演一场，用来验收。
     监听在脚本顶部就挂好了，这里只把开演前排队进来的请求放出来 */
  faceAnt(SCENE.dir);          /* 蚂蚁初始朝向：默认往右漂，所以要镜像 */
  BOOTED = true;
  while(sceneQueue.length) runScene(sceneQueue.shift());
}

/* 设置页换形象 / 改常用语 / 点"试一句"的入口 */
if(window.petAPI){
  if(window.petAPI.onCreature){
    window.petAPI.onCreature(async (p)=>{
      const ok = await applyCreaturePayload(p);
      console.log('[creature] switch', p && p.id, ok);
    });
  }
  if(window.petAPI.onLines){
    window.petAPI.onLines((lines)=>{
      LINES = Array.isArray(lines) ? lines : [];
      S.lastSpoke = {};                        /* 冷却表清掉：刚加的句子要能马上说 */
      console.log('[lines] update', LINES.length);
    });
  }
  if(window.petAPI.onPreview){
    window.petAPI.onPreview((text)=>{ showBubble(String(text || '')); });
  }
}

boot();
</script>
