<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>山海遇灵 · 冉冉桌宠原型</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='19' r='10' fill='%23F2DCD6'/><ellipse cx='11' cy='7' rx='2.4' ry='6' fill='%23F2DCD6'/><ellipse cx='21' cy='7' rx='2.4' ry='6' fill='%23F2DCD6'/></svg>">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap">
<style>
  :root{
    --ink:#4A3B32; --ink-2:#6B5A4C; --paper:#F7F1E8; --cream:#FCF8F2;
    --line:#E3D7C7; --red:#B8402F; --jade:#7C9E96; --gold:#C9963F;
    --shadow:0 10px 28px rgba(74,59,50,.12);
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    font-family:"Noto Sans SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    color:var(--ink); background:
      radial-gradient(120% 90% at 78% 12%, #FBF7F0 0%, #F4ECE0 46%, #EDE3D5 100%);
    overflow:hidden; user-select:none;
  }
  /* 桌面底纹（装饰层，不参与交互） */
  .desk-grid{position:fixed;inset:0;pointer-events:none;opacity:.5;
    background-image:linear-gradient(rgba(74,59,50,.045) 1px,transparent 1px),
                      linear-gradient(90deg,rgba(74,59,50,.045) 1px,transparent 1px);
    background-size:44px 44px;}

  /* ===== 模拟办公窗口 ===== */
  .mock-win{position:fixed;left:38px;top:64px;width:min(560px,44vw);background:#FFFDF9;
    border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;
    pointer-events:none;}
  .mock-bar{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);
    background:#FBF6EC;font-size:12px;color:var(--ink-2)}
  .mock-dot{width:9px;height:9px;border-radius:50%;background:#DCCDB8}
  .mock-dot:nth-child(1){background:#D98E7E}.mock-dot:nth-child(2){background:#E2BE7C}.mock-dot:nth-child(3){background:#9DBBAE}
  .mock-body{padding:16px 18px 22px}
  .code-line{height:8px;border-radius:3px;background:#EDE4D6;margin:9px 0}
  .code-line.w1{width:62%}.code-line.w2{width:84%;background:#E5D9C6}
  .code-line.w3{width:46%}.code-line.w4{width:72%;background:#E5D9C6}
  .code-line.accent{background:#D9C4A6}
  .mock-tag{font-size:11.5px;color:var(--ink-2);letter-spacing:.04em}

  /* ===== 顶部信息 ===== */
  .hud{position:fixed;right:22px;top:20px;display:flex;flex-direction:column;gap:8px;align-items:flex-end;z-index:8}
  .hud-card{background:rgba(252,248,242,.92);border:1px solid var(--line);border-radius:10px;
    padding:8px 12px;font-size:12px;line-height:1.7;backdrop-filter:blur(6px);box-shadow:0 4px 14px rgba(74,59,50,.06)}
  .hud-card b{font-weight:500;color:var(--red)}
  .hud-hint{font-size:11.5px;color:var(--ink-2);max-width:240px;text-align:right}

  /* ===== 台词气泡 ===== */
  .bubble{position:absolute;left:50%;transform:translate(-50%,6px);bottom:100%;margin-bottom:10px;
    max-width:250px;padding:10px 14px;background:#FFFDF9;border:1px solid var(--line);
    border-radius:12px;box-shadow:0 8px 22px rgba(74,59,50,.14);font-size:15px;line-height:1.6;
    opacity:0;transition:opacity .22s ease,transform .22s ease;pointer-events:none;white-space:pre-wrap;z-index:6}
  .bubble.show{opacity:1;transform:translate(-50%,0)}
  .bubble:after{content:"";position:absolute;left:50%;bottom:-6px;width:10px;height:10px;
    margin-left:-5px;background:#FFFDF9;border-right:1px solid var(--line);border-bottom:1px solid var(--line);
    transform:rotate(45deg)}

  /* ===== 角色与蚂蚁 ===== */
  #stage{position:fixed;inset:0;z-index:4}
  #petWrap{position:absolute;left:0;top:0;transform:translate3d(0,0,0);cursor:grab;touch-action:none}
  #petWrap.dragging{cursor:grabbing}
  .pet-canvas{display:block;height:clamp(300px,44vh,470px);width:auto;filter:drop-shadow(0 14px 22px rgba(74,59,50,.16))}
  .ant-wrap{position:absolute;left:0;top:0;cursor:pointer;transition:left .28s ease,top .28s ease}
  .ant-canvas{display:block;height:clamp(84px,13vh,132px);width:auto;filter:drop-shadow(0 8px 14px rgba(74,59,50,.16))}
  .ant-wrap.shiver{animation:antShiver .55s ease-in-out 2}
  @keyframes antShiver{0%,100%{transform:rotate(0)}25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
  .mask-canvas{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .2s}
  .mask-canvas.on{opacity:.55}

  /* ===== 底部工具条 ===== */
  .dock{position:fixed;left:24px;bottom:22px;display:flex;gap:10px;align-items:center;z-index:9}
  .btn{appearance:none;border:1px solid var(--line);background:rgba(252,248,242,.94);color:var(--ink);
    font-family:inherit;font-size:13px;padding:9px 14px;border-radius:9px;cursor:pointer;
    transition:transform .12s,border-color .2s,background .2s;backdrop-filter:blur(6px)}
  .btn:hover{border-color:#CDBBA4;background:#FFFDF9}
  .btn:active{transform:translateY(1px)}
  .btn.on{border-color:var(--red);color:var(--red)}
  .dock-note{font-size:11.5px;color:var(--ink-2);margin-left:4px}

  /* ===== 设置面板 ===== */
  .panel{position:fixed;right:0;top:0;height:100%;width:340px;background:#FFFDF9;border-left:1px solid var(--line);
    box-shadow:-12px 0 34px rgba(74,59,50,.10);transform:translateX(100%);transition:transform .26s ease;
    z-index:12;display:flex;flex-direction:column}
  .panel.open{transform:translateX(0)}
  .panel-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line)}
  .panel-title{font-size:15px;font-weight:500;letter-spacing:.02em}
  .panel-close{border:none;background:transparent;font-size:18px;line-height:1;color:var(--ink-2);cursor:pointer;padding:4px 6px}
  .panel-body{padding:16px 18px 26px;overflow:auto;flex:1}
  .field{margin-bottom:18px}
  .field-label{font-size:12.5px;color:var(--ink-2);margin-bottom:8px;letter-spacing:.03em}
  .seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
  .seg button{flex:1;border:none;background:#FFFDF9;font-family:inherit;font-size:13px;padding:9px 0;cursor:pointer;color:var(--ink-2)}
  .seg button.on{background:#F3E3DC;color:var(--red);font-weight:500}
  .row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;font-size:13px;border-bottom:1px dashed var(--line)}
  .row:last-child{border-bottom:none}
  .sw{width:40px;height:22px;border-radius:12px;background:#E6DAC9;position:relative;cursor:pointer;transition:background .2s;flex:none}
  .sw.on{background:var(--jade)}
  .sw i{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.15)}
  .sw.on i{left:20px}
  .lines-list{max-height:none}
  .line-item{display:flex;gap:8px;align-items:baseline;padding:7px 0;border-bottom:1px dashed var(--line);font-size:12.5px}
  .line-id{color:#A8947C;font-size:11px;font-family:ui-monospace,Consolas,monospace;flex:none;min-width:64px}
  .line-text{flex:1;line-height:1.55}
  .line-w{color:#A8947C;font-size:11px;flex:none}
  .panel-foot{font-size:11.5px;color:var(--ink-2);line-height:1.7;padding:12px 18px;border-top:1px solid var(--line);background:#FBF6EC}

  /* ===== 右键菜单 ===== */
  .ctx{position:fixed;min-width:172px;background:#FFFDF9;border:1px solid var(--line);border-radius:10px;
    box-shadow:0 12px 30px rgba(74,59,50,.16);padding:6px;display:none;z-index:14;font-size:13px}
  .ctx.show{display:block}
  .ctx button{display:block;width:100%;text-align:left;border:none;background:transparent;font-family:inherit;
    font-size:13px;color:var(--ink);padding:9px 10px;border-radius:7px;cursor:pointer}
  .ctx button:hover{background:#F6EDE2}
  .ctx .sep{height:1px;background:var(--line);margin:5px 4px}

  .hidden-pet #petWrap,.hidden-pet .ant-wrap{opacity:0;pointer-events:none;transition:opacity .2s}

  @media (max-width:820px){
    .mock-win{display:none}
    .panel{width:min(88vw,340px)}
  }
</style>
</head>
<body>
<div class="desk-grid" aria-hidden="true"></div>

<!-- 模拟一个正在办公的窗口，用来演示"她陪你办公"的观感 -->
<div class="mock-win" aria-hidden="true">
  <div class="mock-bar"><span class="mock-dot"></span><span class="mock-dot"></span><span class="mock-dot"></span>
    <span style="margin-left:6px">shanhai-yuling / src-tauri / hit_test.rs</span></div>
  <div class="mock-body">
    <div class="code-line w2"></div><div class="code-line w1"></div><div class="code-line w4"></div>
    <div class="code-line accent w3"></div><div class="code-line w2"></div><div class="code-line w1"></div>
    <div class="code-line w4"></div><div class="code-line accent w2"></div><div class="code-line w3"></div>
  </div>
</div>

<div class="hud">
  <div class="hud-card">
    <div>状态：<b id="hudState">REST</b>　帧 <span id="hudFrame">base</span></div>
    <div>档位：<b id="hudMode">quiet</b>　<span id="hudDnd"></span></div>
    <div>渲染：<span id="hudFps">–</span> fps　台词触发 <span id="hudCount">0</span> 次</div>
  </div>
  <div class="hud-hint" id="hudHint">浏览器原型：置顶、分区穿透、托盘、开机自启在桌面版里实现</div>
</div>

<div id="stage">
  <div id="petWrap">
    <div class="bubble" id="bubble"></div>
    <canvas id="petCanvas" class="pet-canvas" width="900" height="1200"></canvas>
    <canvas id="maskCanvas" class="mask-canvas" width="900" height="1200"></canvas>
  </div>
  <div class="ant-wrap" id="antWrap">
    <canvas id="antCanvas" class="ant-canvas" width="600" height="800"></canvas>
  </div>
</div>

<div class="dock">
  <button class="btn" id="btnMode">安静模式</button>
  <button class="btn" id="btnMask">显示穿透区</button>
  <button class="btn" id="btnPanel">设置与台词</button>
  <button class="btn" id="btnHide">隐藏她</button>
  <span class="dock-note">拖她试试</span>
</div>

<aside class="panel" id="panel">
  <div class="panel-head">
    <span class="panel-title">行为与台词</span>
    <button class="panel-close" id="panelClose" aria-label="关闭">×</button>
  </div>
  <div class="panel-body">
    <div class="field">
      <div class="field-label">行为档位</div>
      <div class="seg" id="segMode">
        <button data-mode="quiet" class="on">安静</button>
        <button data-mode="lively">活泼</button>
      </div>
    </div>
    <div class="field">
      <div class="field-label">开关</div>
      <div class="row"><span>主动问候</span><div class="sw on" id="swGreet"><i></i></div></div>
      <div class="row"><span>免打扰 22:30–07:00</span><div class="sw on" id="swDnd"><i></i></div></div>
      <div class="row"><span>演示加速（20×）</span><div class="sw on" id="swSpeed"><i></i></div></div>
    </div>
    <div class="field">
      <div class="field-label">台词库（共 <span id="lineTotal">0</span> 条，当前档位可用 <span id="lineAvail">0</span> 条）</div>
      <div class="lines-list" id="linesList"></div>
    </div>
  </div>
  <div class="panel-foot">
    正式版里这张表读的是 <code>desktop-shell/assets/lines.json</code>，改完保存即生效。
    这里为了让你直接双击就能看，把台词内联进了页面。
  </div>
</aside>

<div class="ctx" id="ctxMenu">
  <button data-act="greet">让她说句话</button>
  <button data-act="panel">打开设置与台词</button>
  <div class="sep"></div>
  <button data-act="hide">隐藏</button>
  <button data-act="reset">回到右下角</button>
</div>

<!-- ===== 素材：只通过 src 引用，避免发布链路裂图 ===== -->
<img id="imgBase"  src="assets/ranran_base_s.png"  alt="" style="display:none">
<img id="imgBlink" src="assets/ranran_blink_s.png" alt="" style="display:none">
<img id="imgTalk"  src="assets/ranran_talk_s.png"  alt="" style="display:none">
<img id="imgSmile" src="assets/ranran_smile_s.png" alt="" style="display:none">
<img id="imgTurn"  src="assets/ranran_turn_s.png"  alt="" style="display:none">
<img id="imgAnt"   src="assets/ant_s.png"          alt="" style="display:none">

<script>
/* =========================================================
   1. 台词库：与 desktop-shell/assets/lines.json 同源
   ========================================================= */
const LINES = [
  {i:'req_01',c:'request',t:'爸爸，陪我玩会。',w:10,cd:900,tags:['quiet','lively'],fu:{t:'就一会儿，玩完我就写作业。',d:8}},
  {i:'req_02',c:'request',t:'爸爸，陪我玩会嘛。',w:6,cd:1200,tags:['lively'],fu:{t:'那你忙完叫我。',d:8}},
  {i:'req_03',c:'request',t:'就五分钟，好不好？',w:5,cd:1500,tags:['lively']},
  {i:'req_04',c:'request',t:'你忙完了吗？',w:4,cd:1800,tags:['quiet']},
  {i:'req_05',c:'request',t:'抱一下。',w:4,cd:1800,tags:['quiet','lively']},
  {i:'greet_01',c:'greeting',t:'爸爸，你在忙什么呀？',w:8,cd:600,tags:['quiet','lively']},
  {i:'greet_02',c:'greeting',t:'我在这儿呢。',w:6,cd:900,tags:['quiet','lively']},
  {i:'greet_03',c:'greeting',t:'要不要休息一下？',w:5,cd:1800,tags:['quiet']},
  {i:'greet_04',c:'greeting',t:'看看你～',w:4,cd:900,tags:['lively']},
  {i:'greet_05',c:'greeting',t:'我画了个东西，你猜是什么？',w:5,cd:1800,tags:['lively'],fu:{t:'猜错了，再猜。',d:10}},
  {i:'greet_06',c:'greeting',t:'你在敲什么呀，好响。',w:3,cd:2400,tags:['quiet']},
  {i:'hover_01',c:'hover',t:'嗯？',w:3,cd:300,tags:['quiet','lively']},
  {i:'hover_02',c:'hover',t:'你看着我干嘛。',w:3,cd:600,tags:['lively']},
  {i:'hover_03',c:'hover',t:'我脸上有东西吗？',w:2,cd:900,tags:['quiet']},
  {i:'click_01',c:'click',t:'嗨！',w:4,cd:120,tags:['quiet','lively']},
  {i:'click_02',c:'click',t:'爸爸你好呀。',w:4,cd:180,tags:['quiet','lively']},
  {i:'click_03',c:'click',t:'要不要陪我玩？',w:3,cd:600,tags:['lively']},
  {i:'click_04',c:'click',t:'我写完这一页啦。',w:3,cd:600,tags:['quiet']},
  {i:'click_05',c:'click',t:'别戳我啦，痒。',w:4,cd:240,tags:['quiet','lively']},
  {i:'click_06',c:'click',t:'再点一下试试。',w:2,cd:900,tags:['lively']},
  {i:'idle_01',c:'idle',t:'嗯……想不出来。',w:4,cd:900,tags:['quiet','lively']},
  {i:'idle_02',c:'idle',t:'这个字好难写。',w:3,cd:1800,tags:['quiet']},
  {i:'idle_03',c:'idle',t:'我的铅笔钝了。',w:2,cd:2400,tags:['quiet']},
  {i:'idle_04',c:'idle',t:'窗外有只小鸟。',w:3,cd:1800,tags:['quiet','lively']},
  {i:'idle_05',c:'idle',t:'好困呀。',w:3,cd:1800,tags:['quiet']},
  {i:'idle_06',c:'idle',t:'我在等你忙完。',w:3,cd:2400,tags:['quiet','lively']},
  {i:'ant_01',c:'ant',t:'小蚂蚁去哪儿了……',w:4,cd:1200,tags:['quiet','lively']},
  {i:'ant_02',c:'ant',t:'小蚂蚁，过来。',w:4,cd:900,tags:['lively']},
  {i:'ant_04',c:'ant',t:'它爬到我手上了。',w:3,cd:1200,tags:['lively']},
  {i:'ant_05',c:'ant',t:'小蚂蚁也会累吗？',w:2,cd:2400,tags:['quiet']}
];

/* =========================================================
   2. 配置：与 desktop-shell/assets/creature.json 同源
   ========================================================= */
const CFG = {
  mode:'quiet',
  modes:{
    quiet:{switchIntervalSec:[24,52],greetPerMin:0.15,maxGreetPerHour:4},
    lively:{switchIntervalSec:[12,28],greetPerMin:0.35,maxGreetPerHour:8}
  },
  motionWeights:{rest:35,study:40,play:25},
  dnd:{enabled:true,start:'22:30',end:'07:00'},
  greeting:{enabled:true,ignoreDecayCount:3},
  demo:{speed:20},
  render:{fpsCap:30,fpsCapWhenUnfocused:10},
  companion:{nearOffsetPx:{x:-96,y:6},states:['held','near']}
};

/* =========================================================
   3. 素材装载
   ========================================================= */
const IMG_IDS = {base:'imgBase',blink:'imgBlink',talk:'imgTalk',smile:'imgSmile',turn:'imgTurn'};
const frames = {};
let assetsReady = false;
const antImg = document.getElementById('imgAnt');
const antCanvas = document.getElementById('antCanvas');
const antCtx = antCanvas.getContext('2d');

function waitImg(img){
  return new Promise(res=>{
    if(img.complete && img.naturalWidth) return res(img);
    img.addEventListener('load',()=>res(img),{once:true});
    img.addEventListener('error',()=>res(null),{once:true});
  });
}

async function loadAll(){
  // 每张图就绪即登记；base 一到就先把她画出来，不等其余差分
  const jobs = Object.entries(IMG_IDS).map(async ([k,id])=>{
    const el = await waitImg(document.getElementById(id));
    if(!el || !el.naturalWidth) return;
    frames[k] = el;
    if(k === 'base'){
      assetsReady = true;
      resizePet();
    }
  });
  await Promise.all(jobs);
  await waitImg(antImg);
  assetsReady = true;
  resizePet();
  drawAnt();
  updateHud();
  document.getElementById('hudHint').textContent = '浏览器原型：置顶、分区穿透、托盘、开机自启在桌面版里实现';
}

/* =========================================================
   4. 主画布与尺寸
   ========================================================= */
const petWrap = document.getElementById('petWrap');
const petCanvas = document.getElementById('petCanvas');
const petCtx = petCanvas.getContext('2d');
const maskCanvas = document.getElementById('maskCanvas');
const maskCtx = maskCanvas.getContext('2d');

let petW = 0, petH = 0;

function resizePet(){
  const b = frames.base;
  if(!b || !b.naturalWidth) return;
  const cssH = petCanvas.getBoundingClientRect().height || 420;
  const ratio = b.naturalWidth / b.naturalHeight;
  petW = Math.round(cssH * ratio);
  petH = Math.round(cssH);
  petCanvas.width = petW; petCanvas.height = petH;
  petCanvas.style.width = petW + 'px';
  maskCanvas.width = petW; maskCanvas.height = petH;
  maskCanvas.style.width = petW + 'px';
  placePet();
}
window.addEventListener('resize',()=>{ resizePet(); drawAnt(); });

/* =========================================================
   5. 状态机
   ========================================================= */
const S = {
  main:'REST',
  frame:'base',
  frameUntil:0,
  dragging:false,
  hidden:false,
  lastSpokeAt:{},
  greetCount:0,
  ignoreStreak:0,
  spokeTotal:0,
  nextSwitchAt:0,
  modeChangedAt:0
};

const modeCfg = ()=>CFG.modes[CFG.mode];

function randRange(a,b){ return a + Math.random()*(b-a); }

function inDnd(){
  if(!CFG.dnd.enabled) return false;
  const now = new Date();
  const m = now.getHours()*60 + now.getMinutes();
  const toMin = s=>{ const [h,mm]=s.split(':').map(Number); return h*60+mm; };
  const a = toMin(CFG.dnd.start), b = toMin(CFG.dnd.end);
  return a <= b ? (m>=a && m<b) : (m>=a || m<b);
}

function scheduleSwitch(){
  const [lo,hi] = modeCfg().switchIntervalSec;
  S.nextSwitchAt = performance.now() + randRange(lo,hi)*1000;
}

function switchMain(){
  const pool = [['REST',CFG.motionWeights.rest],['STUDY',CFG.motionWeights.study],['PLAY',CFG.motionWeights.play]];
  let total = pool.reduce((s,p)=>s+p[1],0);
  let r = Math.random()*total, pick = pool[0][0];
  for(const [k,w] of pool){ if(r<w){pick=k;break;} r-=w; }
  if(pick===S.main){ return scheduleSwitch(); }
  S.main = pick;
  // 每句自言自语只做一次状态提示，不打断交互帧
  if(Math.random()<0.55){ say('idle'); }
  scheduleSwitch();
}

/* =========================================================
   6. 台词引擎（权重 + 冷却 + 档位过滤 + 跟随句）
   ========================================================= */
const bubble = document.getElementById('bubble');
let bubbleTimer = null, followTimer = null;

function eligible(cat){
  const now = performance.now();
  return LINES.filter(l=>{
    if(cat && l.c!==cat) return false;
    if(!l.tags.includes(CFG.mode)) return false;
    const last = S.lastSpokeAt[l.i] || -Infinity;
    return (now-last) >= l.cd*1000*0.12; // 原型里冷却按演示节奏压缩
  });
}

function pickCat(cat){
  const pool = eligible(cat).length ? eligible(cat)
             : LINES.filter(l=>l.tags.includes(CFG.mode) && (!cat || l.c===cat));
  if(!pool.length) return null;
  let total = pool.reduce((s,l)=>s+l.w,0);
  let r = Math.random()*total;
  for(const l of pool){ if(r<l.w) return l; r-=l.w; }
  return pool[pool.length-1];
}

function say(cat, opts={}){
  const line = pickCat(cat);
  if(!line) return;
  S.lastSpokeAt[line.i] = performance.now();
  S.spokeTotal++;
  showBubble(line.t);
  if(opts.frame) setFrame(opts.frame, 700);
  if(line.fu){
    clearTimeout(followTimer);
    followTimer = setTimeout(()=>{
      if(S.dragging) return;
      showBubble(line.fu.t);
    }, line.fu.d*1000);
  }
  updateHud();
}

function showBubble(text){
  bubble.textContent = text;
  bubble.classList.add('show');
  clearTimeout(bubbleTimer);
  bubbleTimer = setTimeout(()=>bubble.classList.remove('show'), Math.max(2600, text.length*220));
}

function setFrame(name, holdMs){
  if(!frames[name]) return;
  S.frame = name;
  S.frameUntil = holdMs ? performance.now()+holdMs : 0;
  updateHud();
}

/* =========================================================
   7. 渲染循环（呼吸 / 摇摆 / 眨眼 / 帧优先级）
   ========================================================= */
let lastBlinkAt = 0, nextBlinkAt = 0, lastT = 0, fpsAcc = 0, fpsFrames = 0, fps = 0, lastDraw = 0;

function currentFpsCap(){
  return document.hasFocus() ? CFG.render.fpsCap : CFG.render.fpsCapWhenUnfocused;
}

function drawPet(t){
  if(!frames.base || S.hidden) return;
  const img = frames[S.frame] || frames.base;
  petCtx.clearRect(0,0,petW,petH);

  // 呼吸与摇摆
  const breathe = Math.sin(t/2200);
  const sway = Math.sin(t/5200);
  const hop = (S.main==='PLAY') ? Math.abs(Math.sin(t/700))*4 : 0;

  petCtx.save();
  petCtx.translate(petW/2, petH);
  petCtx.rotate(sway*0.012);
  petCtx.scale(1, 1 + breathe*0.008);
  petCtx.translate(-petW/2, -petH + breathe*2 + hop);
  petCtx.drawImage(img, 0, 0, petW, petH);
  petCtx.restore();

  // 帧保持时间结束 → 回落
  if(S.frameUntil && t > S.frameUntil){
    S.frame = 'base'; S.frameUntil = 0; updateHud();
  }

  // 眨眼调度
  if(t > nextBlinkAt && S.frame==='base'){
    setFrame('blink', 150);
    lastBlinkAt = t;
    nextBlinkAt = t + randRange(2600,6200);
  }
}

function drawAnt(t){
  if(!antImg.naturalWidth) return;
  const cssH = antCanvas.getBoundingClientRect().height || 110;
  const ratio = antImg.naturalWidth/antImg.naturalHeight;
  const w = Math.round(cssH*ratio), h = Math.round(cssH);
  if(antCanvas.width!==w || antCanvas.height!==h){ antCanvas.width=w; antCanvas.height=h; antCanvas.style.width=w+'px'; }
  antCtx.clearRect(0,0,w,h);
  const bob = Math.sin(t/1600)*3;
  antCtx.save();
  antCtx.translate(w/2, h + bob);
  antCtx.rotate(Math.sin(t/3400)*0.03);
  antCtx.translate(-w/2, -h);
  antCtx.drawImage(antImg, 0, 0, w, h);
  antCtx.restore();
  syncAnt();
}

function loop(t){
  if(!S.dragging && t > S.nextSwitchAt) switchMain();

  // 帧率按配置封顶，别拿 rAF 的 120fps 白烧电
  const cap = currentFpsCap();
  if(t - lastDraw >= (1000/cap) - 1){
    const interval = lastDraw ? (t - lastDraw) : 0;
    lastDraw = t;
    drawPet(t);
    drawAnt(t);
    if(interval > 0){
      fpsAcc += interval; fpsFrames++;
      if(fpsAcc >= 600){
        fps = Math.round(1000/(fpsAcc/fpsFrames));
        fpsAcc = 0; fpsFrames = 0;
        updateHudFps();
      }
    }
  }
  requestAnimationFrame(loop);
}

/* =========================================================
   8. 位置：右下角起始，可拖拽
   ========================================================= */
let pos = {x:0,y:0};

function placePet(){
  const w = window.innerWidth, h = window.innerHeight;
  if(!pos.inited){
    petWrap.style.left = Math.max(24, w - petW - 72) + 'px';
    petWrap.style.top  = Math.max(24, h - petH - 20) + 'px';
    pos.inited = true;
  } else {
    // 窗口尺寸变化（或首帧量到的宽度不准）时，必须把她收回可见区域，否则人就停在屏幕外
    const l = parseFloat(petWrap.style.left) || 0;
    const t = parseFloat(petWrap.style.top) || 0;
    const safeR = w - petW * 0.55;
    const safeB = h - petH * 0.45;
    if(l + petW < 40 || l > Math.max(0, safeR) || t + petH < 80 || t > Math.max(0, safeB)){
      petWrap.style.left = Math.max(0, Math.min(l, w - petW - 16)) + 'px';
      petWrap.style.top  = Math.max(0, Math.min(t, h - petH - 8)) + 'px';
    }
  }
  syncAnt();
}

let _antPos = {l:'',t:''};
function syncAnt(){
  const l = parseFloat(petWrap.style.left)||0;
  const t = parseFloat(petWrap.style.top)||0;
  const off = CFG.companion.nearOffsetPx;
  const antH = antCanvas.getBoundingClientRect().height || 110;
  const antW = antCanvas.getBoundingClientRect().width || 80;
  const ant = document.getElementById('antWrap');
  const nl = (l + off.x - antW*0.2) + 'px';
  const nt = (t + petH - antH + off.y) + 'px';
  if(nl !== _antPos.l){ ant.style.left = nl; _antPos.l = nl; }
  if(nt !== _antPos.t){ ant.style.top  = nt; _antPos.t = nt; }
}

/* =========================================================
   9. 交互
   ========================================================= */
let downAt = null, moved = false, startPt = {x:0,y:0}, startPos = {x:0,y:0};

petWrap.addEventListener('pointerdown', e=>{
  if(e.button!==0) return;
  S.dragging = true; moved = false;
  downAt = performance.now();
  startPt = {x:e.clientX, y:e.clientY};
  startPos = {x:parseFloat(petWrap.style.left)||0, y:parseFloat(petWrap.style.top)||0};
  petWrap.classList.add('dragging');
  petWrap.setPointerCapture(e.pointerId);
});

petWrap.addEventListener('pointermove', e=>{
  if(!S.dragging) return;
  const dx = e.clientX-startPt.x, dy = e.clientY-startPt.y;
  if(Math.abs(dx)>5 || Math.abs(dy)>5) moved = true;
  if(!moved) return;
  const nx = Math.min(window.innerWidth-petW*0.35, Math.max(-petW*0.35, startPos.x+dx));
  const ny = Math.min(window.innerHeight-60, Math.max(-40, startPos.y+dy));
  petWrap.style.left = nx+'px';
  petWrap.style.top  = ny+'px';
  syncAnt();
});

petWrap.addEventListener('pointerup', e=>{
  if(!S.dragging) return;
  S.dragging = false;
  petWrap.classList.remove('dragging');
  if(!moved){
    // 单击：张嘴 + 台词
    setFrame('talk', 520);
    setTimeout(()=>setFrame('smile', 700), 540);
    say('click');
    S.ignoreStreak = 0;
  }
});

petWrap.addEventListener('pointerenter', ()=>{
  if(S.dragging) return;
  if(S.frame==='base'){ setFrame('turn', 760); }
});
petWrap.addEventListener('pointerleave', ()=>{
  if(S.frame==='turn') setFrame('base', 0);
});

petWrap.addEventListener('contextmenu', e=>{
  e.preventDefault();
  const menu = document.getElementById('ctxMenu');
  menu.classList.add('show');
  menu.style.left = Math.min(e.clientX, window.innerWidth-200)+'px';
  menu.style.top = Math.min(e.clientY, window.innerHeight-190)+'px';
});

document.addEventListener('click', e=>{
  const menu = document.getElementById('ctxMenu');
  if(!menu.contains(e.target)) menu.classList.remove('show');
});

document.getElementById('ctxMenu').addEventListener('click', e=>{
  const act = e.target.dataset.act;
  if(!act) return;
  document.getElementById('ctxMenu').classList.remove('show');
  if(act==='greet'){ setFrame('talk',520); say('greeting'); }
  if(act==='panel'){ openPanel(true); }
  if(act==='hide'){ toggleHide(true); }
  if(act==='reset'){ pos.inited=false; placePet(); }
});

// 小蚂蚁
const antWrap = document.getElementById('antWrap');
antWrap.addEventListener('click', ()=>{
  antWrap.classList.remove('shiver');
  void antWrap.offsetWidth;
  antWrap.classList.add('shiver');
  setTimeout(()=>antWrap.classList.remove('shiver'), 1200);
  say('ant');
});

/* =========================================================
   10. 主动问候
   ========================================================= */
let greetAcc = 0;
setInterval(()=>{
  if(!CFG.greeting.enabled || S.hidden || S.dragging) return;
  if(inDnd()) return;
  greetAcc += 1;
  // 每秒触发概率 = 每分钟概率 / 60 × 演示倍速
  const p = modeCfg().greetPerMin / 60 * CFG.demo.speed;
  const capHit = S.greetCount >= modeCfg().maxGreetPerHour*4;
  if(capHit) return;
  if(Math.random() < p){
    S.greetCount++;
    setFrame('talk', 600);
    setTimeout(()=>setFrame('base', 0), 620);
    say(Math.random()<0.5 ? 'request' : 'greeting');
    // 被忽略计数：8 秒内没点她就 +1，连续多次后降低权重
    S.ignoreStreak++;
  }
}, 1000);

/* =========================================================
   11. 穿透区可视化
   ========================================================= */
let maskBuilt = false;
function buildMask(){
  if(maskBuilt || !assetsReady) return;
  const b = frames.base;
  maskCtx.clearRect(0,0,petW,petH);
  // 先铺网格，再按立绘 alpha 裁掉轮廓外的部分，直观说明"掩码不是整块矩形"
  maskCtx.fillStyle = 'rgba(184,64,47,.55)';
  for(let y=0;y<petH;y+=24){
    for(let x=0;x<petW;x+=24){ maskCtx.fillRect(x,y,23,23); }
  }
  maskCtx.globalCompositeOperation = 'destination-in';
  maskCtx.drawImage(b, 0, 0, petW, petH);
  maskCtx.globalCompositeOperation = 'source-over';
  maskBuilt = true;
}

/* =========================================================
   12. 设置面板
   ========================================================= */
const panel = document.getElementById('panel');
function openPanel(v){ panel.classList.toggle('open', v); }

document.getElementById('btnPanel').addEventListener('click', ()=>openPanel(!panel.classList.contains('open')));
document.getElementById('panelClose').addEventListener('click', ()=>openPanel(false));

const btnMode = document.getElementById('btnMode');
document.getElementById('segMode').addEventListener('click', e=>{
  const m = e.target.dataset.mode; if(!m) return;
  CFG.mode = m;
  [...document.querySelectorAll('#segMode button')].forEach(b=>b.classList.toggle('on', b.dataset.mode===m));
  btnMode.textContent = m==='quiet' ? '安静模式' : '活泼模式';
  scheduleSwitch();
  updateHud();
});

btnMode.addEventListener('click', ()=>{
  CFG.mode = CFG.mode==='quiet' ? 'lively' : 'quiet';
  [...document.querySelectorAll('#segMode button')].forEach(b=>b.classList.toggle('on', b.dataset.mode===CFG.mode));
  btnMode.textContent = CFG.mode==='quiet' ? '安静模式' : '活泼模式';
  scheduleSwitch(); updateHud();
});

function bindSwitch(id, get, set){
  const el = document.getElementById(id);
  el.addEventListener('click', ()=>{
    const v = !get();
    set(v);
    el.classList.toggle('on', v);
    updateHud();
  });
}
bindSwitch('swGreet', ()=>CFG.greeting.enabled, v=>CFG.greeting.enabled=v);
bindSwitch('swDnd', ()=>CFG.dnd.enabled, v=>CFG.dnd.enabled=v);
bindSwitch('swSpeed', ()=>CFG.demo.speed>1, v=>CFG.demo.speed = v?20:1);

const btnMask = document.getElementById('btnMask');
btnMask.addEventListener('click', ()=>{
  btnMask.classList.toggle('on');
  const on = btnMask.classList.contains('on');
  buildMask();
  maskCanvas.classList.toggle('on', on);
});

const btnHide = document.getElementById('btnHide');
function toggleHide(v){
  S.hidden = v===undefined ? !S.hidden : v;
  document.body.classList.toggle('hidden-pet', S.hidden);
  btnHide.textContent = S.hidden ? '让她出来' : '隐藏她';
  if(!S.hidden){ resizePet(); drawAnt(); }
}
btnHide.addEventListener('click', ()=>toggleHide());

/* =========================================================
   13. HUD 与台词表
   ========================================================= */
function updateHudFps(){ document.getElementById('hudFps').textContent = fps || '–'; }

function updateHud(){
  document.getElementById('hudState').textContent = S.main;
  document.getElementById('hudFrame').textContent = frames.base ? S.frame : '加载中';
  document.getElementById('hudMode').textContent = CFG.mode==='quiet'?'安静':'活泼';
  document.getElementById('hudDnd').textContent = inDnd() ? '免打扰中' : '';
  document.getElementById('hudCount').textContent = S.spokeTotal;
  document.getElementById('lineTotal').textContent = LINES.length;
  document.getElementById('lineAvail').textContent = eligible(null).length;
}

function renderLines(){
  const box = document.getElementById('linesList');
  const order = ['request','greeting','hover','click','idle','ant'];
  const name = {request:'撒娇要求',greeting:'主动问候',hover:'悬停',click:'点击',idle:'自言自语',ant:'关于小蚂蚁'};
  box.innerHTML = order.map(cat=>{
    const items = LINES.filter(l=>l.c===cat).sort((a,b)=>b.w-a.w);
    return `<div style="font-size:12px;color:#A8947C;margin:14px 0 4px;letter-spacing:.06em">${name[cat]} · ${items.length}</div>` +
      items.map(l=>`<div class="line-item"><span class="line-id">${l.i}</span><span class="line-text">${l.t}</span><span class="line-w">w${l.w}</span></div>`).join('');
  }).join('');
}

/* =========================================================
   14. 启动
   ========================================================= */
scheduleSwitch();
renderLines();
updateHud();
nextBlinkAt = performance.now() + randRange(1200,3000);
loadAll().then(()=>{
  scheduleSwitch();
  // 开场招呼：她先看你一眼
  setTimeout(()=>{ setFrame('turn',900); }, 600);
  setTimeout(()=>{ setFrame('talk',600); showBubble('爸爸，陪我玩会。'); }, 1800);
});
requestAnimationFrame(loop);
</script>
